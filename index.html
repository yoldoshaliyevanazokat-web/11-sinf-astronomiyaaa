<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astronomiya — mavzular</title>
<style>
:root{--bg:#070b18;--panel:#0b1024;--line:rgba(255,255,255,.09);--tx:#eef1fa;--mut:#9aa4c4;--gold:#e8c468;--w:280px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;height:100%}
#side{width:var(--w);flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;z-index:20;transition:transform .25s}
#side header{padding:20px 18px 14px;border-bottom:1px solid var(--line)}
#side header small{color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-size:.7rem}
#side header h1{font-size:1.15rem;margin:6px 0 0}
nav{padding:10px}
.t{width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--tx);font:inherit;font-weight:600;font-size:.95rem;padding:11px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center}
.t i{font-style:normal;flex:none;width:26px;height:26px;border-radius:50%;background:rgba(232,196,104,.15);color:var(--gold);display:grid;place-items:center;font-size:.8rem}
.t:hover{background:rgba(255,255,255,.05)}
.t.on{background:rgba(232,196,104,.1);border-color:rgba(232,196,104,.35)}
.subs{display:none;margin:2px 0 8px 22px;padding-left:12px;border-left:1px solid var(--line)}
.subs.open{display:block}
.s{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mut);font:inherit;font-size:.86rem;padding:8px 10px;border-radius:8px;cursor:pointer}
.s:hover{color:var(--tx);background:rgba(255,255,255,.05)}
.s.on{color:var(--gold)}
#main{flex:1;position:relative;min-width:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#burger{display:none;position:fixed;top:10px;left:10px;z-index:30;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(11,16,36,.92);color:var(--tx);font-size:1.3rem;cursor:pointer;padding:0}
#shade{display:none}
@media(max-width:800px){
  #side{position:fixed;top:0;bottom:0;left:0;width:min(82vw,300px);transform:translateX(-100%)}
  body.open #side{transform:none}
  #burger{display:block}
  body.open #shade{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:15}
}
</style>
</head>
<body>
<button id="burger" aria-label="Menyu">☰</button>
<div id="shade"></div>
<div id="app">
  <aside id="side">
    <header><small>11-sinf · Astronomiya</small><h1>Mavzular ro'yxati</h1></header>
    <nav id="menu"></nav>
  </aside>
  <main id="main"><iframe id="frame" title="Mavzu"></iframe></main>
</div>

const TOPICS = [
  {id:1, title:"Astronomiya nimani o'rganadi?", subs:[
    ["Bosh sahifa","#hero"],["Fan va o'rganish obyekti","#sec1"],["Rivojlanish tarixi","#sec2"],
    ["Boshqa fanlar bilan aloqasi","#sec3"],["Nazorat savollari","#sec4"]]},
  {id:2, title:"Yoritgichlarning sutkalik ko'rinma harakati", subs:[
    ["Bosh sahifa","h1"],["Asosiy g'oya","h2:0"],["Asosiy tushunchalar","h2:1"],
    ["Simulyatsiya: osmon gumbazi","h2:2"],["Kenglikka qarab o'zgarishlar","h2:3"],["Savollar","h2:4"]]}
];
const frame = document.getElementById('frame'), menu = document.getElementById('menu');
let cur = null;

function target(sel){
  const d = frame.contentDocument; if(!d) return null;
  if(sel.startsWith('h2:')) return d.querySelectorAll('h2')[+sel.slice(3)];
  return d.querySelector(sel);
}
function jump(sel, btn){
  const el = target(sel); if(!el) return;
  if(sel === 'h1' || sel === '#hero'){ (frame.contentWindow.scrollTo({top:0,behavior:'smooth'})); }
  else el.scrollIntoView({behavior:'smooth', block:'start'});
  menu.querySelectorAll('.s').forEach(x=>x.classList.remove('on'));
  btn.classList.add('on');
  document.body.classList.remove('open');
}
function open(id, then){
  if(cur !== id){
    cur = id;
    frame.onload = then ? () => setTimeout(then, 150) : null;
    frame.srcdoc = dec(B64[id]);
  } else if(then) then();
  menu.querySelectorAll('.t').forEach(b=>b.classList.toggle('on', +b.dataset.id===id));
  menu.querySelectorAll('.subs').forEach(s=>s.classList.toggle('open', +s.dataset.id===id));
  history.replaceState(null,'','#t'+id);
}
TOPICS.forEach(t=>{
  const b = document.createElement('button');
  b.className='t'; b.dataset.id=t.id; b.innerHTML=`<i>${t.id}</i><span>${t.title}</span>`;
  b.onclick=()=>{ open(t.id); if(innerWidth<=800) document.body.classList.remove('open'); };
  const s = document.createElement('div'); s.className='subs'; s.dataset.id=t.id;
  t.subs.forEach(([label,sel])=>{
    const x=document.createElement('button'); x.className='s'; x.textContent=label;
    x.onclick=()=>open(t.id, ()=>jump(sel,x)); s.appendChild(x);
  });
  menu.append(b,s);
});
document.getElementById('burger').onclick=()=>document.body.classList.toggle('open');
document.getElementById('shade').onclick=()=>document.body.classList.remove('open');
const h = location.hash.match(/^#t(\d+)$/);
open(h && B64[h[1]] ? +h[1] : 1);
